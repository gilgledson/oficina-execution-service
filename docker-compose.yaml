# Ambiente local do Execution Service: MongoDB próprio, RabbitMQ e a aplicação.
# Antes de subir: ./mvnw clean package -DskipTests
services:
  execution-db:
    image: mongo:7
    container_name: execution-mongo
    ports:
      - "27018:27017"
    volumes:
      - execution-db-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Em produção o RabbitMQ é compartilhado pelos microsserviços; aqui sobe
  # junto para o serviço rodar sozinho. Painel: http://localhost:15672 (oficina/oficina)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oficina-rabbitmq
    environment:
      # O usuário padrão "guest" só é aceito a partir de localhost; o serviço
      # conecta de outro container, então usa este.
      - RABBITMQ_DEFAULT_USER=oficina
      - RABBITMQ_DEFAULT_PASS=oficina
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  execution-service:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: oficina-execution-service
    ports:
      - "8385:8080"
    environment:
      - MONGODB_URL=mongodb://execution-db:27017
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=oficina
      - RABBITMQ_PASSWORD=oficina
    depends_on:
      execution-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  execution-db-data:
