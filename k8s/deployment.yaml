apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-execution
  template:
    metadata:
      labels:
        app: oficina-execution
    spec:
      containers:
      - name: oficina-execution
        image: docker.io/gilgledson/oficina-execution-service:latest
        imagePullPolicy: Always
        resources:
          # A JVM parada consome por volta de 100m. Com a reserva antiga, de
          # 100m, o HPA via 100% de uso sem nenhuma carga e escalava até o
          # máximo; as JVMs subindo juntas saturavam o nó e as sondas matavam
          # os pods em cascata.
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m" # folga para a subida da JVM, que é o pico de CPU
            memory: "512Mi"
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60 # até 5 minutos para subir em um nó disputado
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 4
        envFrom:
        - configMapRef:
            name: oficina-execution-config
        env:
        # Connection string do MongoDB (inclui usuário e senha), por isso vem de Secret.
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: oficina-execution-secrets
              key: mongodb-url
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: oficina-execution-secrets
              key: rabbitmq-username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oficina-execution-secrets
              key: rabbitmq-password
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: oficina-execution-secrets
              key: new-relic-license-key
