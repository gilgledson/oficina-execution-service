# Rotas do API Gateway (Traefik) para o Execution Service. Os prefixos mais
# específicos têm prioridade sobre a rota "/" do OS Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-execution-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/execucoes
            pathType: Prefix
            backend:
              service:
                name: oficina-execution-service
                port:
                  number: 8080
          - path: /api/relatorios
            pathType: Prefix
            backend:
              service:
                name: oficina-execution-service
                port:
                  number: 8080
          - path: /api/funcionarios
            pathType: Prefix
            backend:
              service:
                name: oficina-execution-service
                port:
                  number: 8080
